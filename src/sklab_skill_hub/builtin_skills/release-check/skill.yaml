schema_version: 1
id: release-check
name: Release Check
version: 1.0.0
description: "Pre-release checklist: version, changelog, build, smoke."
type: checklist
category: git
tags:
  - git
  - release
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
permissions:
  filesystem:
    read: true
    write: false
  shell: true
  git:
    read: true
    write: false
inputs:
  - release
outputs:
  - verdict
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: [git]
