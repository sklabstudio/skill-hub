schema_version: 1
id: docker-debug
name: Docker Debug
version: 1.0.0
description: Diagnose container build and runtime failures.
type: workflow
category: devops
tags:
  - devops
  - docker
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
permissions:
  filesystem:
    read: true
    write: false
  shell: true
inputs:
  - dockerfile
outputs:
  - diagnosis
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: []
