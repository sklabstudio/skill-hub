schema_version: 1
id: refactor-safe
name: Safe Refactor
version: 1.0.0
description: Behavior-preserving refactor with before/after test evidence.
type: workflow
category: coding
tags:
  - coding
  - refactor
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
    - capability: shell
permissions:
  filesystem:
    read: true
    write: true
  shell: true
  git:
    read: true
    write: false
inputs:
  - target
outputs:
  - refactor
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: [git]
