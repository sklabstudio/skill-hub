schema_version: 1
id: typecheck-fix
name: Typecheck Fix
version: 1.0.0
description: Fix static type errors without loosening safety.
type: workflow
category: frontend
tags:
  - frontend
  - types
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
    - capability: shell
permissions:
  filesystem:
    read: true
    write: true
  shell: true
inputs:
  - type-errors
outputs:
  - fix
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: []
