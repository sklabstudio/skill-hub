schema_version: 1
id: fastapi-debug
name: FastAPI Debug
version: 1.0.0
description: "Diagnose FastAPI failures: routing, validation, dependency injection."
type: workflow
category: backend
tags:
  - backend
  - fastapi
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
permissions:
  filesystem:
    read: true
    write: false
  shell: true
inputs:
  - traceback
outputs:
  - diagnosis
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: []
