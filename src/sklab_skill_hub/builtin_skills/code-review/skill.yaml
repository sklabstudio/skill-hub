schema_version: 1
id: code-review
name: Code Review
version: 1.0.0
description: Review a diff for correctness, regressions, scope and security.
type: workflow
category: coding
tags:
  - coding
  - review
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
permissions:
  filesystem:
    read: true
    write: false
  shell: true
inputs:
  - diff
outputs:
  - review
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: []
