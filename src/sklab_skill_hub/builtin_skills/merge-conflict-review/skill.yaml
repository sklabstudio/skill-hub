schema_version: 1
id: merge-conflict-review
name: Merge Conflict Review
version: 1.0.0
description: Resolve merge conflicts preserving intent of both sides.
type: workflow
category: git
tags:
  - git
  - git
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
    - capability: shell
permissions:
  filesystem:
    read: true
    write: true
  shell: true
  git:
    read: true
    write: false
inputs:
  - branches
outputs:
  - resolved-tree
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: [git]
