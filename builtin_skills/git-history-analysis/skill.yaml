schema_version: 1
id: git-history-analysis
name: Git History Analysis
version: 1.0.0
description: Analyze git history for risk, churn and ownership signals.
type: workflow
category: git
tags:
  - git
  - git
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
    - capability: shell
permissions:
  filesystem:
    read: true
    write: false
  shell: true
  git:
    read: true
    write: false
inputs:
  - repository
outputs:
  - history-report
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: [git]
