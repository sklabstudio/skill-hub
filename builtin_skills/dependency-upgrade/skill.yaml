schema_version: 1
id: dependency-upgrade
name: Dependency Upgrade
version: 1.0.0
description: Upgrade one dependency safely with changelog and test evidence.
type: workflow
category: coding
tags:
  - coding
  - deps
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
    - capability: shell
permissions:
  filesystem:
    read: true
    write: true
  shell: true
inputs:
  - package
outputs:
  - upgrade-report
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: [git]
