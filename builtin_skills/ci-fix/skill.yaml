schema_version: 1
id: ci-fix
name: CI Fix
version: 1.0.0
description: Fix a failing CI workflow using exact logs.
type: workflow
category: devops
tags:
  - devops
  - ci
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
    - capability: shell
permissions:
  filesystem:
    read: true
    write: true
  shell: true
  git:
    read: true
    write: false
inputs:
  - ci-log
outputs:
  - fix
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: [git]
