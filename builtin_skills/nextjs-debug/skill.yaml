schema_version: 1
id: nextjs-debug
name: Next.js Debug
version: 1.0.0
description: Diagnose Next.js App Router, data-fetching and build issues.
type: workflow
category: frontend
tags:
  - frontend
  - nextjs
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
permissions:
  filesystem:
    read: true
    write: false
  shell: true
inputs:
  - traceback
outputs:
  - diagnosis
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: []
