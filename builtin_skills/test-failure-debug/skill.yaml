schema_version: 1
id: test-failure-debug
name: Test Failure Debug
version: 1.0.0
description: Diagnose a failing test from trusted output without unrelated changes.
type: workflow
category: coding
tags:
  - coding
  - debug
trust:
  source: builtin
compatibility:
  sklab: ">=0.1"
  agents:
    - capability: files_read
permissions:
  filesystem:
    read: true
    write: false
  shell: true
inputs:
  - failure-output
outputs:
  - diagnosis
entry:
  file: SKILL.md
provenance:
  source_type: builtin
  source_url: builtin://sklab-studio/skill-hub
  source_ref: v0.1.0
  license: MIT
requires:
  tools: []
