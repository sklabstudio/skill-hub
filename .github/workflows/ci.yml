name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src || true
      - name: Pytest
        run: pytest
      - name: Build
        run: python -m build
      - name: Wheel smoke
        run: |
          pip install --force-reinstall dist/*.whl
          sklab-skills --version
          sklab-skills --help
          sklab-skills list
          sklab-skills doctor
          sklab-skills auto status
